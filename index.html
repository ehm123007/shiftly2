    <script>
      // Safeguard: In some iframe/sandbox environments, window.fetch has only a getter.
      // Any tool or script attempting to reassign window.fetch throws "Cannot set property fetch of #<Window> which has only a getter".
      // We provide both getter and setter so assignments succeed smoothly.
      (function() {
        try {
          var activeFetch = window.fetch;
          var patch = function(obj) {
            if (!obj) return;
            try {
              Object.defineProperty(obj, 'fetch', {
                get: function() {
                  return activeFetch;
                },
                set: function(fn) {
                  activeFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          };
          patch(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            patch(Window.prototype);
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            patch(globalThis);
          }
        } catch (err) {}
      })();
    </script>
